<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin • status</title>
    <style>
        /* Абсолютный минимум. Только необходимое */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f7;  /* светлый фон, как у Apple */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            line-height: 1.4;
        }

        .container {
            max-width: 580px;
            width: 100%;
            background-color: transparent; /* прозрачный — никаких карточек */
            padding: 20px 0;
        }

        /* Название — обычный текст, без капса */
        .title {
            font-size: 42px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #1d1d1f;
            margin-bottom: 8px;
            line-height: 1;
        }

        /* Статус — парой слов */
        .status {
            font-size: 20px;
            font-weight: 350;
            color: #6e6e73;
            margin-bottom: 40px;
            border-left: 2px solid #cbcbcf;
            padding-left: 16px;
        }

        .status span {
            color: #97ff97;  /* синий, но не ярко */
            font-weight: 400;
        }

        /* Только ссылки. Без блоков, без рамок */
        .link-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #e9e9ed;
        }

        .link-row:first-of-type {
            border-top: 1px solid #e9e9ed;
        }

        .link-label {
            font-size: 17px;
            font-weight: 400;
            color: #86868b;
            min-width: 80px;
        }

        .link-value {
            font-size: 19px;
            font-weight: 430;
            color: #0066cc;
            text-decoration: none;
            transition: color 0.1s;
            word-break: break-word;
        }

        .link-value:hover {
            color: #003d99;
            text-decoration: underline;
        }

        /* Только Telegram. Discord иконка не нужна — есть текст выше.
           Один символ, без подписи */
        .telegram-icon {
            margin: 40px 0 48px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .telegram-icon a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background-color: #f0f0f4;
            border-radius: 50%;
            transition: background-color 0.15s;
        }

        .telegram-icon a:hover {
            background-color: #e3e3e9;
        }

        .telegram-icon svg {
            width: 24px;
            height: 24px;
            fill: #1d1d1f;
            opacity: 0.8;
        }

        /* Копирайт — мелко и незаметно */
        .footer {
            font-size: 13px;
            color: #a1a1a6;
            border-top: none;
            padding-top: 12px;
            font-weight: 350;
            letter-spacing: -0.01em;
        }

        /* Адаптивность: просто уменьшаем отступы */
        @media (max-width: 480px) {
            .title {
                font-size: 38px;
            }
            .link-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 16px 0;
            }
            .link-label {
                font-size: 15px;
            }
            .link-value {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dolphin — обычное слово, первая буква заглавная -->
        <div class="title">Dolphin</div>
        <div class="status">Status: <span>Undetect</span></div>

        <!-- Discord — чистая ссылка -->
        <div class="link-row">
            <span class="link-label">Discord</span>
            <a href="https://discord.gg/dlph" target="_blank" rel="noopener noreferrer" class="link-value">discord.gg/dlph</a>
        </div>

        <!-- Get Key — тоже просто ссылка -->
        <div class="link-row">
            <span class="link-label">Get Key</span>
            <a href="https://t.me/dlph_keybot" target="_blank" rel="noopener noreferrer" class="link-value">t.me/dlph_keybot</a>
        </div>

        <!-- Минимализм: только Telegram в виде иконки (без текста, без Discord-иконки — Discord уже есть как текст) -->
        <div class="telegram-icon">
            <a href="https://t.me/dolphindlc" target="_blank" rel="noopener noreferrer" aria-label="Telegram bot">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                </svg>
            </a>
        </div>

        <!-- Копирайт — очень легко, без границ -->
        <div class="footer">
            © 2026 Dolphin. All rights reserved.
        </div>
    </div>
</body>
</html>
